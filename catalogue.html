<!DOCTYPE html>
<html>
<head>
    <title>Book Catalogue</title>
</head>

<body>

    <h1 align="center">BOOK CATALOGUE</h1>

    <table border="1" cellpadding="10" cellspacing="0" align="center">

        <tr>
            <th>Book Cover</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Price</th>
            <th>Add to Cart</th>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/80x100?text=Book+1"
                     alt="Book 1">
            </td>
            <td>R. K. Narayan</td>
            <td>Penguin Books</td>
            <td>₹299</td>
            <td>
                <button>Add to Cart</button>
            </td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/80x100?text=Book+2"
                     alt="Book 2">
            </td>
            <td>George Orwell</td>
            <td>Penguin Classics</td>
            <td>₹399</td>
            <td>
                <button>Add to Cart</button>
            </td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/80x100?text=Book+3"
                     alt="Book 3">
            </td>
            <td>J. K. Rowling</td>
            <td>Bloomsbury</td>
            <td>₹499</td>
            <td>
                <button>Add to Cart</button>
            </td>
        </tr>

    </table>

</body>
</html>
