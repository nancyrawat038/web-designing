<!DOCTYPE html>
<html>
<head>
    <title>CSS Demonstration</title>

    <style>

        body {
            font-family: "Times New Roman";
            font-size: 18px;
            background-image: url("https://via.placeholder.com/1200x800");
            background-repeat: no-repeat;
            background-size: cover;
        }

        .box {
            background-image: url("https://via.placeholder.com/600x200");
            background-repeat: repeat-x;
            padding: 30px;
            margin: 50px;
            border: 2px solid black;
            text-align: center;
        }

        h1 {
            color: darkblue;
            font-family: Arial;
        }

        a:link {
            color: blue;
        }

        a:visited {
            color: purple;
        }

        a:hover {
            color: red;
        }

        a:active {
            color: green;
        }

    </style>
</head>

<body>

    <div class="box">

        <h1>CSS Web Page</h1>

        <p>
            This page demonstrates different fonts,
            background images and link styles.
        </p>

        <a href="https://www.google.com">
            Visit Google
        </a>

    </div>

</body>
</html>
