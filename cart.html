<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>

<body>

    <h1 align="center">SHOPPING CART</h1>

    <table border="1" cellpadding="10" cellspacing="0" align="center">

        <tr>
            <th>Book</th>
            <th>Author</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>

        <tr>
            <td>The Guide</td>
            <td>R. K. Narayan</td>
            <td>₹299</td>
            <td>1</td>
            <td>₹299</td>
        </tr>

        <tr>
            <td>1984</td>
            <td>George Orwell</td>
            <td>₹399</td>
            <td>1</td>
            <td>₹399</td>
        </tr>

        <tr>
            <td colspan="4" align="right">
                <b>Grand Total</b>
            </td>
            <td>
                <b>₹698</b>
            </td>
        </tr>

    </table>

    <p align="center">
        <button>Proceed to Checkout</button>
    </p>

</body>
</html>
